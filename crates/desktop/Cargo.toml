[package]
name = "fly-and-you"
version = "0.1.0"
edition = "2024"
default-run = "fly-and-you"

[[bin]]
name = "fly-trailer"
path = "src/trailer_main.rs"

[dependencies]
brain_core = { path = "../brain_core", features = ["embedded-model"] }
fly-brain-worker = { path = "../brain_worker" }
world_core = { path = "../world_core" }
wire_types = { path = "../wire_types" }
bevy = { version = "=0.19.1", default-features = false, features = ["2d", "ui"] }
bevy_egui = { version = "=0.42.0", default-features = false, features = ["render", "default_fonts"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom = "0.3"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
