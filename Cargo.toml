[workspace]
members = ["crates/world_core", "crates/wire_types", "crates/desktop", "crates/brain_core", "crates/brain_worker"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

# The neural task is part of the desktop process and must retain release-level RNG
# and validation performance even during native development play checks.
[profile.dev.package.brain_core]
opt-level = 3

[profile.dev.package.fly-brain-worker]
opt-level = 3
