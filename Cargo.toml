[workspace]
members = ["crates/world_core", "crates/wire_types", "crates/desktop", "crates/brain_core", "crates/brain_worker"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2
