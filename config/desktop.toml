[world]
width_px = 640
height_px = 360
collision_cell_px = 4
geometry_units_per_px = 256

[simulation]
physics_hz = 100
physics_ticks_per_decision = 4
decisions_hz = 25
neural_dt_ms = 20
neural_steps_per_decision = 2
render_hz_target = 60
wall_time_backlog_cap_ms = 80
worker_warning_ms = 250
worker_fault_ms = 2000

[body]
half_width_px = 6
half_height_px = 8
max_horizontal_speed_px_s = 176
horizontal_acceleration_px_s2 = 1056
gravity_px_s2 = 1100
max_fall_speed_px_s = 320
jump_speed_px_s = 144
jump_enabled = false
autostep_height_px = 4
collision_substep_max_px = 2

[sensor]
profile = "eye-level-v2"
width = 128
height = 96
horizontal_fov_degrees = 110
corridor_depth_px = 64
actor_visible = false
hud_visible = false
turn_with_heading = true
terrain_occludes = true
empty_space_ink = "both_corridor_side_walls"

[editor]
pause_on_stroke = false
start_on_first_stroke = true
solid_radius_min_px = 4
solid_radius_max_px = 24
visual_radius_min_px = 1
visual_radius_max_px = 24
max_polyline_points = 2048
actor_guard_px = 4
max_undo_transactions = 64
color_selects_ink = true
selected_color_toggles_off = true
ground_uses_selected_color = true
default_color = "none"

[controller]
mode = "malecns_fixed"
backend = "candle-metal-csr-f32-v1"
execution = "in_process_background_thread"
transport = "bounded_channels"
model_storage = "embedded"
rng = "numpy-pcg64-normal-f64-v1"
protocol_version = 2
learning = false
max_inflight = 1
max_message_bytes = 1048576

[music]
enabled = true
mix = "mono"
volume = 0.35
tempo_bpm = 90
stale_after_ms = 1000
pause_release_ms = 400
reset_release_ms = 30
volume_ramp_ms = 60

[controller.chromatic]
profile = "eye-level-v2 / ChromaticValenceV1"
readout_scale = 0.025
explore_speed = 0.52
retreat_speed = 0.85
retreat_decisions = 20
search_decisions = 88
search_commit_decisions = 10
enter_threshold = 0.08
release_threshold = 0.03
red_dominance = 1.25
clear_decisions = 8
approach_half_response = 0.25
